<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<!-- 桌面端（非触屏宽屏）动态更新 viewport，移除 user-scalable=no -->
<script>
  (function() {
    var isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 1;
    var isSmall = window.innerWidth <= 520;
    if (!isTouch && !isSmall) {
      var vp = document.querySelector('meta[name="viewport"]');
      if (vp) vp.setAttribute('content', 'width=device-width, initial-scale=1.0');
    }
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#f5f5f5" />
<title>福厝艺集 · 低保真原型</title>
<style>
  /* ========== 全局重置 ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
  body {
    background: #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* ========== 手机外壳 ========== */
  .phone {
    width: min(375px, 100vw);
    height: min(812px, 100vh);
    max-width: 100%;
    max-height: 100%;
    background: #f5f5f5;
    border: 10px solid #1a1a1a;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .notch {
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 150px; height: 28px;
    background: #1a1a1a;
    border-bottom-left-radius: 18px;
    border-bottom-right-radius: 18px;
    z-index: 100;
  }
  .screen {
    width: 100%; height: 100%;
    position: relative;
    overflow: hidden;
    background: #f5f5f5;
    display: flex;
    flex-direction: column;
  }

  /* ========== 状态栏 ========== */
  .status-bar {
    height: 44px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 24px 6px;
    font-size: 14px;
    font-weight: 600;
    color: #1a1a1a;
    background: #fff;
    flex-shrink: 0;
  }

  /* ========== 顶部导航栏 ========== */
  .nav-bar {
    height: 44px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    position: relative;
    flex-shrink: 0;
  }
  .nav-bar .back {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    border: none; background: none;
    color: #1a1a1a;
    font-size: 22px;
  }
  .nav-bar .title {
    position: absolute;
    left: 50%; transform: translateX(-50%);
    font-size: 17px; font-weight: 600; color: #1a1a1a;
    white-space: nowrap;
  }
  .nav-bar .right-placeholder { width: 32px; }

  /* ========== Tab 标签栏 ========== */
  .tab-bar {
    display: flex;
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    flex-shrink: 0;
    position: relative;
    z-index: 20;
  }
  .tab-item {
    flex: 1;
    text-align: center;
    padding: 12px 0;
    font-size: 14px;
    color: #666;
    cursor: pointer;
    position: relative;
    transition: color .2s;
  }
  .tab-item.active {
    color: #1a1a1a;
    font-weight: 600;
  }
  .tab-item.active::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 28px; height: 3px;
    background: #1a1a1a;
    border-radius: 2px;
  }

  /* ========== 内容滚动区 ========== */
  .content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0;
    background: #f5f5f5;
    position: relative;
    z-index: 5;
  }
  /* 官方 / 同人文创：排序条全宽紧贴 Tab 栏，其余内容保留 16px 留白 */
  #panel-official, #panel-fan { padding-bottom: 16px; }
  #panel-official .shop-list, #panel-fan .shop-list,
  #panel-official .shop-empty, #panel-fan .shop-empty { margin: 0 16px; }
  /* 自定义文创面板保留原有留白 */
  #panel-custom { padding: 16px; }

  /* ========== 提示词模块 ========== */
  .form-group { margin-bottom: 18px; }
  .form-label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 8px;
  }
  .prompt-wrap {
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .form-input {
    flex: 1;
    min-height: 56px;
    padding: 10px 12px;
    border: 1px solid #d0d0d0;
    border-radius: 8px;
    background: #fff;
    font-size: 13px;
    line-height: 1.5;
    color: #1a1a1a;
    resize: none;
    font-family: inherit;
    outline: none;
    transition: border-color .2s;
  }
  .form-input:focus { border-color: #1a1a1a; }
  .ai-polish-btn {
    flex-shrink: 0;
    padding: 0 12px;
    height: 36px;
    border: 1px solid #1a1a1a;
    border-radius: 8px;
    background: #fff;
    color: #1a1a1a;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    align-self: flex-start;
    transition: all .2s;
  }
  .ai-polish-btn:active:not(:disabled) { background: #1a1a1a; color: #fff; }
  .ai-polish-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ========== 品类选择 ========== */
  .category-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .cat-item {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 40px;
    border: 1px solid #d0d0d0;
    border-radius: 8px;
    background: #fff;
    font-size: 13px;
    color: #1a1a1a;
    cursor: pointer;
    transition: all .2s;
    user-select: none;
  }
  .cat-item.active {
    background: #1a1a1a;
    color: #fff;
    border-color: #1a1a1a;
  }

  /* ========== 主生成按钮 ========== */
  .generate-btn {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 10px;
    background: #1a1a1a;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
    margin-bottom: 20px;
    transition: opacity .2s;
  }
  .generate-btn:active:not(:disabled) { opacity: .85; }
  .generate-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ========== 预览区标题 ========== */
  .preview-title {
    font-size: 14px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 12px;
  }

  /* ========== 空态 ========== */
  .empty-state {
    background: #fff;
    border: 1px dashed #ccc;
    border-radius: 12px;
    padding: 48px 20px;
    text-align: center;
    color: #999;
  }
  .empty-state .icon {
    font-size: 44px;
    margin-bottom: 10px;
    opacity: .6;
  }
  .empty-state .text {
    font-size: 14px;
  }

  /* ========== 加载态 ========== */
  .loading-state {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    padding: 48px 20px;
    text-align: center;
    color: #1a1a1a;
  }
  .spinner {
    width: 36px; height: 36px;
    margin: 0 auto 14px;
    border: 3px solid #e0e0e0;
    border-top-color: #1a1a1a;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-state .text {
    font-size: 14px;
    color: #666;
  }

  /* ========== 作品卡片 ========== */
  .work-card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    overflow: hidden;
  }
  .work-img {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #fafafa;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
  }
  /* AI 效果图角标 */
  .work-ai-tag {
    position: absolute;
    right: 8px;
    bottom: 8px;
    padding: 2px 6px;
    font-size: 10px;
    line-height: 1.5;
    color: #fff;
    background: rgba(0, 0, 0, .42);
    border-radius: 4px;
    pointer-events: none;
  }
  .work-img.landscape {
    aspect-ratio: 4 / 3;
  }
  .work-img img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .work-meta {
    padding: 12px 14px;
  }
  .work-name {
    font-size: 14px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 4px;
  }
  .work-price {
    font-size: 13px;
    color: #1a1a1a;
    margin-bottom: 6px;
  }
  .work-price b {
    font-size: 18px;
    font-weight: 700;
  }
  .work-price-tip {
    font-size: 11px;
    color: #999;
    margin-left: 6px;
  }
  .work-desc {
    font-size: 12px;
    color: #888;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .work-ops {
    display: flex;
    gap: 10px;
    padding: 10px;
    margin: 14px 14px 0;
    background: #fafafa;
    border-radius: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .work-ops button {
    flex: 1;
    height: 38px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    border: 1px solid transparent;
  }
  .work-ops button svg { width: 16px; height: 16px; flex-shrink: 0; }
  .op-preview {
    border-color: #d0d0d0;
    background: #fff;
    color: #1a1a1a;
  }
  .op-preview:active { background: #f5f5f5; }
  .op-save {
    border-color: #d0d0d0;
    background: #fff;
    color: #1a1a1a;
  }
  .op-save:active { background: #f5f5f5; }
  .op-regen {
    border: none;
    background: #1a1a1a;
    color: #fff;
  }
  .op-regen:active { opacity: .85; }
  .work-buy {
    display: block;
    width: calc(100% - 28px);
    margin: 10px 14px 14px;
    height: 44px;
    border: none;
    border-radius: 22px;
    background: #e53935;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .work-buy:active { opacity: .88; }

  /* ========== 大图预览弹层 ========== */
  .preview-mask {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .preview-mask.show { display: flex; }
  .preview-mask img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  .preview-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,.15);
    border: none;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ========== Toast ========== */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,.78);
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 300;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* ========== 官方 / 同人 商品列表 ========== */
  .shop-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .shop-card {
    background: #fff;
    border: 1px solid #e8e8e8;
    border-radius: 10px;
    overflow: hidden;
  }
  .shop-img {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #fafafa;
    overflow: hidden;
  }
  .shop-img img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .shop-badge {
    position: absolute;
    top: 8px; left: 8px;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 600;
    border-radius: 4px;
    color: #fff;
  }
  .shop-badge.official { background: #1a1a1a; }
  .shop-badge.fan { background: #666; }
  .shop-badge.custom { background: #b7700e; }

  /* 我的文创商品 */
  .my-goods-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 22px 0 10px;
  }
  .my-goods-title {
    font-size: 14px;
    font-weight: 700;
    color: #1a1a1a;
  }
  .my-goods-title::before {
    content: '';
    display: inline-block;
    width: 3px; height: 13px;
    background: #b7700e;
    border-radius: 2px;
    margin-right: 6px;
    vertical-align: -2px;
  }
  .my-goods-count { font-size: 11px; color: #999; }
  .shop-info { padding: 8px 10px 10px; }
  .shop-name {
    font-size: 13px;
    font-weight: 600;
    color: #1a1a1a;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 4px;
  }
  .shop-stats {
    font-size: 11px;
    color: #999;
    margin-bottom: 6px;
  }
  .shop-price-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .shop-price {
    font-size: 15px;
    font-weight: 700;
    color: #1a1a1a;
  }
  .shop-price b { font-size: 18px; }
  .shop-sold {
    font-size: 11px;
    color: #999;
    flex: 1;
  }
  .shop-cart {
    width: 26px; height: 26px;
    border: none;
    border-radius: 50%;
    background: #f0f0f0;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .shop-cart:active { background: #e0e0e0; }
  .shop-promos {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .shop-promos span {
    font-size: 10px;
    color: #888;
    border: 1px solid #e0e0e0;
    border-radius: 3px;
    padding: 1px 5px;
  }

  /* ========== iframe 嵌入时自适应（作为 index.html 子页面） ========== */
  body.in-iframe {
    background: #f5f5f5;
    margin: 0;
    padding: 0;
    display: block;
    overflow: hidden;
    height: 100%;
  }
  body.in-iframe .phone {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 0;
    box-shadow: none;
    background: #f5f5f5;
    overflow: hidden;
  }
  body.in-iframe .notch { display: none; }
  body.in-iframe .status-bar { display: none; }
  body.in-iframe .nav-bar { display: none; }
  body.in-iframe .screen { height: 100%; background: #f5f5f5; overflow: hidden; }

  /* ========== 商城排序条 ========== */
  .shop-sortbar {
    display: flex;
    align-items: center;
    background: #fff;
    border-bottom: 1px solid #eee;
    position: sticky;
    top: 0;
    z-index: 10;
    transition: transform .25s ease;
    will-change: transform;
  }
  /* 向上滚动时收起排序条，浏览更简洁 */
  .shop-sortbar.sb-hidden {
    transform: translateY(-110%);
  }
  .ss-item {
    position: relative;
    padding: 11px 10px;
    font-size: 13px;
    color: #555;
    cursor: pointer;
    white-space: nowrap;
  }
  .ss-item.active { color: #1a1a1a; font-weight: 700; }
  .ss-arrow { font-size: 10px; }
  .ss-filter {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 11px 14px;
    font-size: 13px;
    color: #555;
    cursor: pointer;
  }
  .ss-filter.active { color: #1a1a1a; font-weight: 700; }
  /* 综合下拉菜单 */
  .comp-menu {
    position: absolute;
    top: 100%; left: 0;
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,.1);
    z-index: 20;
    min-width: 120px;
  }
  .comp-opt { padding: 9px 12px; font-size: 12px; color: #555; font-weight: 400; white-space: nowrap; }
  .comp-opt.active { color: #1a1a1a; font-weight: 700; background: #f5f5f5; }

  /* ========== 商城筛选面板 ========== */
  .shop-filter-panel {
    background: #fff;
    border-bottom: 1px solid #eee;
    padding: 12px 16px 14px;
  }
  .sf-label { font-size: 12px; color: #888; margin-bottom: 8px; font-weight: 600; }
  .sf-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .sf-chip {
    padding: 5px 12px;
    border: 1px solid #e0e0e0;
    border-radius: 14px;
    background: #fff;
    font-size: 12px;
    color: #555;
    cursor: pointer;
    transition: all .15s;
  }
  .sf-chip.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .sf-price {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .sf-price-item {
    padding: 5px 12px;
    border: 1px solid #e0e0e0;
    border-radius: 14px;
    background: #fff;
    font-size: 12px;
    color: #555;
    cursor: pointer;
  }
  .sf-price-item.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .sf-actions { display: flex; gap: 10px; }
  .sf-actions button {
    flex: 1;
    height: 36px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .sf-reset { background: #fff; border: 1px solid #e0e0e0; color: #555; }
  .sf-reset:active { background: #f5f5f5; }
  .sf-confirm { background: #1a1a1a; border: none; color: #fff; }
  .sf-confirm:active { opacity: .85; }

  /* ========== 空态（筛选无结果） ========== */
  .shop-empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 48px 20px;
    color: #999;
    font-size: 14px;
  }
  .shop-empty span { font-size: 12px; color: #bbb; display: block; margin-top: 6px; }

  /* ========== 商品详情页（覆盖层，图二布局） ========== */
  .pd-page, .ck-page {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 300;
    background: #f5f5f5;
    flex-direction: column;
  }
  .pd-page.show, .ck-page.show { display: flex; }
  .pd-nav {
    display: flex;
    align-items: center;
    height: 44px;
    background: #fff;
    border-bottom: 1px solid #eee;
    flex-shrink: 0;
    padding: 0 8px;
  }
  .pd-back {
    width: 32px; height: 32px;
    border: none; background: transparent;
    font-size: 22px; color: #1a1a1a;
    cursor: pointer; line-height: 1;
  }
  .pd-nav-title {
    flex: 1;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: #1a1a1a;
  }
  .pd-nav-act {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #333; cursor: pointer;
  }
  .pd-scroll, .ck-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* 顶部大图 */
  .pd-hero { position: relative; background: #fafafa; }
  .pd-hero img { width: 100%; display: block; aspect-ratio: 1 / 1; object-fit: cover; }
  .pd-shop {
    position: absolute; right: 10px; top: 10px;
    max-width: 60%;
    background: rgba(0,0,0,.45); color: #fff;
    font-size: 11px; padding: 4px 10px; border-radius: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pd-hero-count {
    position: absolute; right: 10px; bottom: 10px;
    background: rgba(0,0,0,.5); color: #fff;
    font-size: 11px; padding: 3px 10px; border-radius: 12px;
  }

  /* 价格区 */
  .pd-price-card { background: #fff; padding: 12px 14px 10px; }

    clearTimeout(t._timer);

  // 扫码游客的地址只保存在本次会话，普通用户保存在本机
  function addrStorage() {
    try {
      if (window.top !== window && window.top.sessionStorage.getItem('gucuo_scan_guest')) return sessionStorage;
    } catch (e) {}
    return localStorage;
  }

    return !!(a && a.name && a.phone && a.region && a.detail);

    return p && p.length >= 7 ? p.slice(0, 3) + '****' + p.slice(-4) : (p || '');
  }

  function escHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'

  function saveAddress() {
    const name = $('addrName').value.trim();
    const phone = $('addrPhone').value.replace(/\s/g, '');
    const region = $('addrRegion').value.trim();
    const detail = $('addrDetail').value.trim();
    const fail = msg => { $('addrErr').textContent = msg; return false; };
    if (!name) return fail('请填写收货人姓名');
    if (!/^1\d{10}$/.test(phone)) return fail('请填写 11 位手机号');
    if (!region) return fail('请填写所在地区');
    if (!detail) return fail('请填写详细地址');
    try { addrStorage().setItem(ADDR_KEY, JSON.stringify({ name, phone, region, detail })); } catch (e) {}

  /* ========== AI 优化文案：内置大模型润色 ========== */
  // 逻辑：保留用户核心创意 → 强制融入福州古厝5元素 → 按品类匹配工艺 → 随机风格/构图
  function optimizePrompt() {
    const ta = $('culturalPrompt');
    const btn = $('polishBtn');
    const isEn = typeof window.getLang === 'function' && window.getLang() === 'en';

    let base = (ta.value || '').trim();
    if (!base) {
      base = isEn
        ? 'Fuzhou historic residence swallowtail ridges and saddle walls, minimalist and elegant'
        : '以福州古厝燕尾脊、马鞍墙为元素，风格简约雅致';
    }

    // 若之前优化过，剥离旧的「【AI优化】」段，取用户原始创意
    base = base.split('【AI优化】')[0].split('[AI Enhanced]')[0].replace(/[。\s]+$/, '');
    // 去掉开头的「以」方便拼接句式
    const baseClean = isEn ? base : base.replace(/^以/, '').replace(/[。\s]+$/, '');

    btn.disabled = true;
    btn.textContent = '优化中…';

    // 模拟大模型思考延迟
    setTimeout(() => {
      let polished;
      if (isEn) {
        // 英文模式：直接产出英文绘图提示词（古厝元素 + 品类材质工艺 + 风格构图 + 负面提示）
        const catName = CAT_NAME_EN[currentCat] || 'cultural-creative product';
        const elementsStr = 'incorporating Fuzhou historic residence motifs: saddle walls, swallowtail ridges, grey plaster sculpture, grey tiles and banyan trees';
        const craft = POLISH_CRAFT_EN[currentCat] || 'fine crafted details';
        const style = pick(POLISH_STYLE_EN);
        const composition = pick(POLISH_COMPOSITION_EN);
        const isShortPhrase = base.length <= 12 && !/[,\s]/.test(base);
        polished = isShortPhrase
          ? `A ${catName} centered on "${baseClean}", ${elementsStr}, ${style}, ${craft}, ${composition}, high detail, ideal for a ${catName} design.`
          : `${base}, ${elementsStr}, ${style}, ${craft}, ${composition}, high detail, ideal for a ${catName} design.`;
        polished += ` Negative prompt: ${NEGATIVE_PROMPT_EN}.`;
      } else {
        // 强制元素：马鞍墙、燕尾脊、灰塑、青瓦、榕树（全部必须出现）
        const elementsStr = '融入福州古厝' + MUST_ELEMENTS.join('、') + '元素';

        // 按品类匹配材质工艺
        const craft = POLISH_CRAFT[currentCat] || '精致工艺细节';
        // 随机风格 + 构图，避免每次雷同
        const style = pick(POLISH_STYLE);
        const composition = pick(POLISH_COMPOSITION);

        // 句式选择：短创意用「以…为主体」，长描述直接拼接，避免语法不通
        const isShortPhrase = !base.includes('为元素') && !base.includes('风格') && base.length <= 12;
        const templates = isShortPhrase
          ? [
              `以${baseClean}为主体，${elementsStr}，${style}，${craft}，${composition}，高清细腻，适合${currentCat}文创落地。`,
              `主体为${baseClean}，${elementsStr}，${style}，${craft}，${composition}，适合${currentCat}文创。`,
              `${base}，${elementsStr}，${style}，${craft}，${composition}，画面精致，适合${currentCat}文创落地。`
            ]
          : [
              `${base}，${elementsStr}，${style}，${craft}，${composition}，高清细腻，适合${currentCat}文创落地。`,
              `${base}，结合${elementsStr.replace('融入', '')}，${style}，${craft}，${composition}，适合${currentCat}文创。`,
              `${base}，${elementsStr}，${style}，${craft}，${composition}，画面精致，适合${currentCat}文创落地。`
            ];
        polished = pick(templates) + `负面提示：${NEGATIVE_PROMPT}。`;
      }

      ta.value = (isEn ? '[AI Enhanced] ' : '【AI优化】') + polished;

      // 自适应高度：先 auto 让内容溢出，再读真实 scrollHeight
      ta.style.height = 'auto';
      ta.offsetHeight; // 强制回流
      ta.style.height = Math.min(ta.scrollHeight + 4, 280) + 'px';

      showToast('AI 已完成文案优化');
      btn.disabled = false;
      btn.textContent = 'AI优化文案';
    }, 600);
  }

  function pickN(arr, n) {
    const copy = arr.slice();
    const out = [];
    while (copy.length && out.length < n) {
      out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
    }
    return out;
  }

          <div class="work-price">¥<b>${price}</b><span class="work-price-tip">（AI定制款，含设计费）</span></div>
        </div>
        <div class="work-ops">
          <button class="op-preview" onclick="openPreview('${work.img}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>预览</button>
          <button class="op-save" onclick="saveWorkToGoods()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>保存</button>
          <button class="op-regen" onclick="generateWork()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>重新生成</button>
        </div>
        <button class="work-buy" onclick="buyCurrentWork()">立即购买</button>
      </div>`;
    // 同步作品到父页面（个人中心"我的文创作品"展示用）
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'fzyj-work', work: work }, '*');
    }
  }

  /* ========== 保存作品为独立商品 ========== */
  function saveWorkToGoods(silent) {
    if (!currentWork) { showToast('请先生成文创作品'); return; }
    if (savedWorks.some(g => g.img === currentWork.img)) {
      if (!silent) showToast('该作品已保存过，可在下方查看');
      return;
    }
    const price = CAT_PRICE[currentWork.cat] || 45;
    const name = `古厝元素·${currentWork.cat}（AI定制款）`;
    const today = new Date();
    const dateStr = today.toISOString().slice(0, 10);

    savedWorks.unshift({
      id: 'custom-' + Date.now(),
      name: name,
      cat: currentWork.cat,
      price: price,
      img: currentWork.img,
      rate: '好评率100%',
      stat: '1 人评价',
      soldText: '1',
      salesNum: 1,
      date: dateStr,
      promos: ['AI定制款', '含设计费'],
      desc: `依据你的描述「${(currentWork.prompt || '').slice(0, 40) || '福州古厝元素'}」由 AI 生成的定制${currentWork.cat}，纹样取自燕尾脊、马鞍墙与花窗格，单件制作、独一无二。`
    });

    renderMyGoods();
    if (!silent) {
      showToast('已保存为我的文创商品');
      const box = $('myGoodsBox');
      if (box) setTimeout(() => box.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 120);
    }
  }

  // 生成的作品直接进入购买流程（未保存时先自动保存为商品）
  function buyCurrentWork() {
    if (!currentWork) { showToast('请先生成文创作品'); return; }
    let g = savedWorks.find(x => x.img === currentWork.img);
    if (!g) {
      saveWorkToGoods(true);
      g = savedWorks.find(x => x.img === currentWork.img);
    }
    if (!g) return;
    openProductDetail('custom', g.id);
  }

  function renderMyGoods() {
    const box = $('myGoodsBox');
    const grid = $('myGoodsGrid');
    if (!box || !grid) return;
    if (!savedWorks.length) { box.style.display = 'none'; return; }
    box.style.display = '';
    $('myGoodsCount').textContent = `共 ${savedWorks.length} 件`;
    grid.innerHTML = savedWorks.map(g => `
      <div class="shop-card" onclick="openProductDetail('custom', '${g.id}')">
        <div class="shop-img">
          <img src="${g.img}" alt="${g.name}">
          <span class="shop-badge custom">定制</span>
        </div>
        <div class="shop-info">
          <div class="shop-name">${g.name}</div>
          <div class="shop-stats">${g.rate}&ensp;·&ensp;${g.stat}</div>
          <div class="shop-price-row">
            <span class="shop-price">¥<b>${g.price}</b></span>
            <span class="shop-sold">已售${g.soldText}</span>
            <button class="shop-cart" onclick="event.stopPropagation(); showToast('已加入购物车（模拟）')">🛒</button>
          </div>
          <div class="shop-promos">${g.promos.map(p => `<span>${p}</span>`).join('')}</div>
        </div>
      </div>`).join('');
  }

  /* ========== 生成结果本地缓存：相同提示词+相同品类优先复用 ========== */
  const GEN_CACHE_KEY = 'fzyj_gen_cache_v1';
  const GEN_CACHE_FALLBACK_TTL = 10 * 60 * 1000; // 预制样稿缓存 10 分钟内有效，过期后重新尝试真图
  function readGenCache(cat, prompt) {
    try {
      const map = JSON.parse(localStorage.getItem(GEN_CACHE_KEY) || '{}');
      const v = map[cat + '|' + prompt];
      if (!v || !v.u) return null;
      if (v.f && Date.now() - v.t > GEN_CACHE_FALLBACK_TTL) return null;
      return v.u;
    } catch (e) { return null; }
  }
  function writeGenCache(cat, prompt, url, isFallback) {
    try {
      const map = JSON.parse(localStorage.getItem(GEN_CACHE_KEY) || '{}');
      map[cat + '|' + prompt] = { u: url, t: Date.now(), f: isFallback ? 1 : 0 };
      const keys = Object.keys(map);
      if (keys.length > 40) keys.slice(0, keys.length - 40).forEach(k => delete map[k]);
      localStorage.setItem(GEN_CACHE_KEY, JSON.stringify(map));
    } catch (e) { /* 缓存失败不影响主流程 */ }
  }

  /* ========== AI 生成文创效果图（含轮询重试，确保真图可见） ========== */
  function generateWork() {
    const btn = $('generateBtn');
    // 防重复提交
    if (btn.disabled) return;

    const isEn = typeof window.getLang === 'function' && window.getLang() === 'en';
    const prompt = ($('culturalPrompt').value || '').trim()
      || (isEn
        ? 'Fuzhou historic residence swallowtail ridges and saddle walls, minimalist and elegant'
        : '以福州古厝燕尾脊、马鞍墙为元素，风格简约雅致');

    btn.disabled = true;
    btn.textContent = '正在生成，请稍候';

    renderLoading();

    // 拼装文生图提示词：先锁定产品实物形态，古厝元素仅作为表面纹样
    // AI 优化文案已把品类工艺与负面提示写进 textarea，这里拆开分别拼装
    const typeEn = CAT_EN[currentCat] || 'souvenir';
    const positive = prompt.replace(/(负面提示|Negative prompt)[:：].*$/, '').trim();
    const imgPrompt = `product photography of ${typeEn}, the ancient house elements (swallow-tail ridge, horse-saddle wall, grey tile, banyan tree) are decorative patterns on the product surface only, NOT the product shape, chinese guofeng style, ${positive}, elegant minimalist design, clean solid white background, e-commerce studio shot, high detail, sharp focus, avoid distorted architecture, cluttered background, deformed elements, blurry low resolution`;
    const baseUrl = t2i(imgPrompt, CAT_IMG_SIZE[currentCat] || 'square');

    // 网络真图出不来时：优先用品类预生成图，再退到国风占位 SVG
    const fallback = CAT_LOCAL_IMG[currentCat] || placeholderImg(currentCat);

    let finalImg = null;
    const workId = Date.now();
    let previewShown = false;

    // 用 Image 对象加载（不受跨域 CORS 限制）
    // 返回 Promise<{ok:boolean, url:string}>
    function loadImage(url) {
      return new Promise(resolve => {
        const img = new Image();
        let done = false;
        const timeout = setTimeout(() => {
          if (!done) { done = true; resolve({ ok: false, url: url }); }
        }, 4500); // 单次加载 4.5s 超时（接口命中缓存时通常 1s 内返回）
        img.onload = () => {
          if (!done) {
            done = true; clearTimeout(timeout);
            // naturalWidth > 0 且不是服务端占位图（1832×1832 的英文「图片生成中」）
            const isPlaceholder = img.naturalWidth === 1832 && img.naturalHeight === 1832;
            resolve({ ok: img.naturalWidth > 0 && !isPlaceholder, url: url });
          }
        };
        img.onerror = () => {
          if (!done) { done = true; clearTimeout(timeout); resolve({ ok: false, url: url }); }
        };
        img.src = url;
      });
    }

    // 交付结果：首次用参考图交付，后续真图到达时只替换画面，不重复上报作品
    function showResult(img) {
      const work = { id: workId, img: img, cat: currentCat, prompt: prompt.slice(0, 60) };
      if (previewShown) {
        currentWork = work;
        const imgEl = document.querySelector('#previewArea .work-img img');
        if (imgEl) imgEl.src = img;
      } else {
        previewShown = true;
        renderWork(work);
      }
      btn.disabled = false; btn.textContent = 'AI生成文创效果图';
    }

    // 3.5s 内没出真图，先交付该品类预制样稿，避免长时间等待；后台继续等真图
    const earlyTimer = setTimeout(() => {
      if (!finalImg) {
        writeGenCache(currentCat, prompt, fallback, true);
        showResult(fallback);
      }
    }, 3500);

    // 轮询：先等 1.2s loading，之后每 2.5s 重试（带时间戳绕过 CDN 占位图缓存），总时长上限 15s
    const startAt = Date.now();
    const limitMs = 15000;

    async function poll() {
      const txt = document.querySelector('#previewArea .loading-state .text');
      await new Promise(r => setTimeout(r, 1200));
      while (Date.now() - startAt < limitMs) {
        if (txt) txt.textContent = '正在生成，请稍候（' + Math.round((Date.now() - startAt) / 1000) + 's）';
        const tsUrl = baseUrl + '&_t=' + Date.now();
        const result = await loadImage(tsUrl);
        if (result.ok) {
          finalImg = result.url;
          writeGenCache(currentCat, prompt, finalImg);
          clearTimeout(earlyTimer);
          showResult(finalImg);
          return;
        }
        const left = limitMs - (Date.now() - startAt);
        if (left > 0) await new Promise(r => setTimeout(r, Math.min(2500, left)));
      }
      // 超限静默加载该品类预制样稿，不打断游客操作
      clearTimeout(earlyTimer);
      finalImg = fallback;
      showResult(fallback);
    }

    // 相同提示词+相同品类优先读取本地缓存，二次生成几乎瞬时完成
    const cachedUrl = readGenCache(currentCat, prompt);
    if (cachedUrl) {
      loadImage(cachedUrl).then(hit => {
        if (hit.ok) {
          clearTimeout(earlyTimer);
          showResult(cachedUrl);
        } else {
          poll();
        }
      });
    } else {
      poll();
    }
  }

  /* ========== 离线兜底：生成国风示意 SVG ========== */
  function placeholderImg(cat) {
    const icon = CAT_ICON[cat] || '🎁';
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
      <defs>
        <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fbf8f1"/>

      </defs>
      <rect width="400" height="400" fill="url(#paper)"/>
      <path d="M0 300 Q70 258 130 288 Q200 248 262 288 Q330 256 400 300 L400 400 L0 400 Z" fill="#e6dcc7" opacity="0.85"/>
      <path d="M0 340 Q90 312 160 336 Q240 308 320 338 Q360 322 400 340 L400 400 L0 400 Z" fill="#d8cbb2" opacity="0.7"/>
      <path d="M40 372 Q80 356 110 372 M150 372 Q190 352 230 372 M270 372 Q320 354 360 372" stroke="#b9a98c" stroke-width="2" fill="none" opacity="0.8"/>
      <rect x="18" y="18" width="364" height="364" rx="12" fill="none" stroke="#2b2b2b" stroke-width="1.6" stroke-dasharray="8 6"/>
      <circle cx="336" cy="58" r="21" fill="none" stroke="#b23a32" stroke-width="2"/>
      <text x="336" y="65" font-size="18" font-family="serif" text-anchor="middle" fill="#b23a32">厝</text>
      <text x="200" y="176" font-size="96" text-anchor="middle">${icon}</text>
      <text x="200" y="228" font-size="21" font-family="sans-serif" text-anchor="middle" fill="#2b2b2b" font-weight="bold">古厝元素·${cat}</text>
      <text x="200" y="254" font-size="13" font-family="sans-serif" text-anchor="middle" fill="#8a8175">福州古厝 · 闽都国风文创</text>
      <text x="200" y="288" font-size="12" font-family="sans-serif" text-anchor="middle" fill="#a8a094">AI 出图通道繁忙，可点「重新生成」重试</text>
    </svg>`;

  }

  /* ========== 大图预览 ========== */
  function openPreview(src) {
    $('previewImg').src = src;
    $('previewMask').classList.add('show');
  }
  function closePreview() {
    $('previewMask').classList.remove('show');
  }

  /* ========== 保存图片（模拟） ========== */
  function saveImage(src) {
    // 跨域图片无法直接 a[download]，改用新标签打开供用户右键另存，避免跳转走当前页
    try { window.open(src, '_blank'); } catch(e) {}
    showToast('已打开图片，可长按/右键保存');
  }

  /* ========== 返回 ========== */
  function goBack() {
    showToast('返回上一页');
  }

  /* ========== 排序筛选栏：跟随页面滑动隐藏/显示 ========== */
  // 向上滑动（内容上滚）超过阈值后隐藏排序条；向下滑动或回到顶部附近时重新显示。
  // 筛选面板 / 综合下拉展开时不自动隐藏，避免打断用户操作。
  (function () {
    const contentEl = $('content');
    if (!contentEl) return;
    let lastTop = 0;
    let ticking = false;
    const HIDE_AFTER = 50;   // 滚动超过该距离后才允许隐藏
    const DIR_DELTA = 6;     // 方向判定死区，防止轻微抖动

    function currentSortbar() {
      const off = $('panel-official'), fan = $('panel-fan');
      if (off && off.style.display !== 'none') return $('sortbar-official');
      if (fan && fan.style.display !== 'none') return $('sortbar-fan');
      return null; // 自定义文创页无排序条
    }

    function update() {
      ticking = false;
      const bar = currentSortbar();
      const top = contentEl.scrollTop;
      if (!bar) { lastTop = top; return; }
      const view = bar.id === 'sortbar-official' ? 'official' : 'fan';
      const st = shopState[view];
      const delta = top - lastTop;

      // 筛选面板或综合下拉展开时：保持显示，不随滚动隐藏
      if (st && (st.filterOpen || st.compOpen)) {
        bar.classList.remove('sb-hidden');
        lastTop = top;
        return;
      }

      if (top <= HIDE_AFTER || delta < -DIR_DELTA) {
        bar.classList.remove('sb-hidden');           // 向下滚动 / 接近顶部 → 显示
      } else if (delta > DIR_DELTA && top > HIDE_AFTER) {
        bar.classList.add('sb-hidden');              // 向上滚动 → 隐藏
      }
      lastTop = top;
    }

    contentEl.addEventListener('scroll', () => {
      if (!ticking) {
        ticking = true;
        requestAnimationFrame(update);
      }
    }, { passive: true });

    // 供 switchTab 调用：恢复显示并重置基线
    window.resetSortbarVisibility = function () {
      lastTop = contentEl.scrollTop;
      document.querySelectorAll('.shop-sortbar').forEach(b => b.classList.remove('sb-hidden'));
    };
  })();

  /* ========== 初始化：自适应提示词高度 ========== */
  // 文生图商品图兜底：接口未出图时会返回 1832×1832 的英文占位图，统一替换为中文提示图
  function t2iBusyImg(label) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
      <rect width="400" height="400" fill="#f3f1ec"/>
      <rect x="16" y="16" width="368" height="368" fill="none" stroke="#d8d2c6" stroke-width="1.5" rx="10"/>
      <text x="200" y="196" font-size="17" font-family="sans-serif" text-anchor="middle" fill="#8a8073">${label}</text>
      <text x="200" y="230" font-size="14" font-family="sans-serif" text-anchor="middle" fill="#aaa298">图片生成中，可稍后刷新</text>
    </svg>`;
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  function watchT2iImages() {
    const guard = el => {
      if (!el || el.dataset.t2iGuarded || !/text_to_image/.test(el.src || '')) return;
      el.dataset.t2iGuarded = '1';
      const fix = () => {
        if (el.naturalWidth === 1832 && el.naturalHeight === 1832) {
          el.src = t2iBusyImg(el.alt || '古厝文创');
        }
      };
      if (el.complete) fix(); else el.addEventListener('load', fix, { once: true });
    };
    document.querySelectorAll('img').forEach(guard);
    new MutationObserver(muts => {
      muts.forEach(m => m.addedNodes && m.addedNodes.forEach(n => {
        if (n.nodeType !== 1) return;
        if (n.tagName === 'IMG') guard(n);
        else if (n.querySelectorAll) n.querySelectorAll('img').forEach(guard);
      }));
    }).observe(document.body, { childList: true, subtree: true });
  }

  (function init() {
    // 默认进入「官方文创」Tab 并渲染商品列表
    switchTab('official');
    watchT2iImages();
    const ta = $('culturalPrompt');
    ta.style.height = 'auto';
    ta.offsetHeight;
    ta.style.height = Math.min(ta.scrollHeight + 4, 280) + 'px';
    ta.addEventListener('input', () => {
      ta.style.height = 'auto';
      ta.offsetHeight;
      ta.style.height = Math.min(ta.scrollHeight + 4, 280) + 'px';
    });
  })();
</script>
